<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지표 대시보드</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
    
    /* 추가된 표(테이블) 디자인 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
    th { background-color: #f8f9fa; font-weight: bold; }
    .poll-source { text-align: right; font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>📊 실시간 대시보드</h1>

  <div class="grid-container">
    <!-- 코스피 위젯 -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div id="kospi-number" style="margin-top: 5px; margin-bottom: 15px; font-family: sans-serif;">수치 로딩중...</div>
      <img id="kospi-chart" src="https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png" alt="실시간 코스피 차트" style="width: 100%; border-radius: 4px;">
      <div style="text-align: right; font-size: 12px; color: #888; margin-top: 10px;">* 네이버 증권 실시간 연동</div>
    </div>

    <!-- 환율 위젯 -->
    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "FX_IDC:USDKRW",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 지지율 영역 -->
    <div class="card full-width">
      <h3>📈 국정 및 정당 지지율</h3>
      <div id="poll-data">데이터를 불러오는 중입니다...</div>
    </div>
  </div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrpXqyXnwBL7AJ7K51EtGS64VAVHzPGswF-dCXE9LVMFSZZS040xdhkrqkyrccJs1LbGYRvetNIgm/pub?output=csv';

    if(sheetUrl !== '여기에_복사한_링크_붙여넣기') {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(csv => {
          const rows = csv.split('\n').filter(row => row.trim() !== '');
          let tableHtml = '<table>';
          
          rows.forEach((row, index) => {
            const cols = row.split(','); 
            tableHtml += '<tr>';
            cols.forEach(col => {
              if(index === 0) tableHtml += `<th>${col.trim()}</th>`;
              else tableHtml += `<td>${col.trim()}</td>`;
            });
            tableHtml += '</tr>';
          });
          
          tableHtml += '</table><div class="poll-source">* 구글 스프레드시트와 실시간 연동됨</div>';
          document.getElementById('poll-data').innerHTML = tableHtml;
        })
        .catch(err => {
          document.getElementById('poll-data').innerHTML = "데이터를 불러오는 데 실패했습니다. 링크를 다시 확인해주세요.";
        });
    } 
// 네이버 실시간 코스피 수치 및 차트 가져오기 (10초 자동 갱신)
    function updateKospi() {
      const targetUrl = 'https://m.stock.naver.com/api/index/KOSPI/basic';
      fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl) + '&nocache=' + Date.now())
        .then(res => res.json())
        .then(data => {
          const parsed = JSON.parse(data.contents);
          const price = parsed.closePrice; 
          const change = parsed.compareToPreviousClosePrice;
          const changePct = parsed.fluctuationsRatio;
          
          let color = '#333';
          let sign = '';
          // 등락률이 양수인지 음수인지 확인하여 색상 결정
          if (parseFloat(changePct) > 0) { color = '#d32f2f'; sign = '+'; }
          else if (parseFloat(changePct) < 0) { color = '#1976d2'; }
          
          document.getElementById('kospi-number').innerHTML = 
            `<span style="font-size: 28px; font-weight: bold; color: ${color};">${price}</span> 
             <span style="font-size: 15px; color: ${color}; margin-left: 8px;">${sign}${change} (${changePct}%)</span>`;
             
          // 10초마다 차트 이미지도 최신으로 갱신
          document.getElementById('kospi-chart').src = 'https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png?' + Date.now();
        })
        .catch(err => console.log("코스피 데이터 갱신 지연"));
    }

    updateKospi(); // 홈페이지를 열자마자 1번 바로 실행
    setInterval(updateKospi, 10000); // 이후 10초마다 자동으로 반복 실행    
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 경제 지표 대시보드</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <h1>📊 실시간 대시보드</h1>

  <div class="grid-container">
    <!-- 코스피 위젯 (트레이딩뷰 연동으로 교체 - 절대 고장 안 남) -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "KRX:KOSPI",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1D",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 환율 위젯 -->
    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "FX_IDC:USDKRW",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 지지율 뉴스 영역 (한국갤럽) -->
    <div class="card">
      <h3>📈 한국갤럽 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-gallup" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>한국갤럽 뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>

    <!-- 지지율 뉴스 영역 (리얼미터) -->
    <div class="card">
      <h3>📈 리얼미터 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-realmeter" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>리얼미터 뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>
  </div> <!-- grid-container 종료 -->

  <script>
    // 구글 뉴스 실시간 가져오기 (검색어 자동화 함수)
    function fetchNews(keyword, elementId) {
      const rssUrl = 'https://news.google.com/rss/search?q=' + encodeURIComponent(keyword) + '&hl=ko&gl=KR&ceid=KR:ko';
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            const items = data.items.slice(0, 5); // 최신 뉴스 5개만
            let newsHtml = '';
            items.forEach(item => {
              newsHtml += `<li><a href="${item.link}" target="_blank" style="color: #2c3e50; text-decoration: none;">${item.title}</a></li>`;
            });
            document.getElementById(elementId).innerHTML = newsHtml;
          } else {
            document.getElementById(elementId).innerHTML = "<li>뉴스를 불러오지 못했습니다.</li>";
          }
        })
        .catch(err => {
          document.getElementById(elementId).innerHTML = "<li>뉴스 로딩 중 오류가 발생했습니다.</li>";
        });
    }

    // 한국갤럽과 리얼미터 검색어로 각각 뉴스를 불러와 화면에 뿌려줍니다.
    fetchNews('대통령 지지율 한국갤럽', 'news-list-gallup');
    fetchNews('대통령 지지율 리얼미터', 'news-list-realmeter');
  </script>
</body>
</html>

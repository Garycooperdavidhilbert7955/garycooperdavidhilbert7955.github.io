<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 경제/정치 지표 대시보드</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    .poll-source { text-align: right; font-size: 12px; color: #888; margin-top: 10px; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>📊 실시간 대시보드</h1>

  <div class="grid-container">
    
    <!-- 첫 번째 줄: 경제 지표 (코스피, 환율) -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div id="kospi-number" style="margin-top: 5px; margin-bottom: 15px; font-family: sans-serif;">수치 로딩중...</div>
      <img id="kospi-chart" src="https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png" alt="실시간 코스피 차트" style="width: 100%; border-radius: 4px;">
      <div class="poll-source">* 네이버 증권 실시간 연동</div>
    </div>

    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "FX_IDC:USDKRW",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 두 번째 줄: 정치 지표 그래프 (가로 전체 차지) -->
    <div class="card full-width">
      <h3>📈 대통령 국정 지지율 추이</h3>
      <div style="height: 300px; width: 100%;">
        <canvas id="poll-chart"></canvas>
      </div>
      <div class="poll-source">* 구글 스프레드시트 연동 (수동 입력 데이터)</div>
    </div>

    <!-- 세 번째 줄: 뉴스 게시판 (한국갤럽, 리얼미터) -->
    <div class="card">
      <h3>📰 한국갤럽 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-gallup" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h3>📰 리얼미터 지지율 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list-realmeter" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>뉴스 불러오는 중...</li>
        </ul>
      </div>
    </div>

  </div> <!-- grid-container 종료 -->

  <script>
    // 1. 코스피 가져오기 (30초 자동 갱신)
    function updateKospi() {
      const targetUrl = 'https://m.stock.naver.com/api/index/KOSPI/basic';
      fetch('https://api.codetabs.com/v1/proxy?quest=' + targetUrl + '&nocache=' + Date.now())
        .then(res => res.json())
        .then(data => {
          const price = data.closePrice; 
          const change = data.compareToPreviousClosePrice.replace('+', '');
          const changePct = data.fluctuationsRatio.replace('+', '');
          
          let color = '#333';
          let sign = '';
          if (parseFloat(changePct) > 0) { color = '#d32f2f'; sign = '+'; }
          else if (parseFloat(changePct) < 0) { color = '#1976d2'; }
          
          document.getElementById('kospi-number').innerHTML = 
            `<span style="font-size: 28px; font-weight: bold; color: ${color};">${price}</span> 
             <span style="font-size: 15px; color: ${color}; margin-left: 8px;">${sign}${change} (${sign}${changePct}%)</span>`;
             
          document.getElementById('kospi-chart').src = 'https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png?' + Date.now();
        })
        .catch(err => console.log("코스피 갱신 대기 중..."));
    }

    updateKospi();
    setInterval(updateKospi, 30000);

    // 2. 구글 뉴스 가져오기
    function fetchNews(keyword, elementId) {
      const rssUrl = 'https://news.google.com/rss/search?q=' + encodeURIComponent(keyword) + '&hl=ko&gl=KR&ceid=KR:ko';
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            const items = data.items.slice(0, 5); 
            let newsHtml = '';
            items.forEach(item => {
              newsHtml += `<li><a href="${item.link}" target="_blank" style="color: #2c3e50; text-decoration: none;">${item.title}</a></li>`;
            });
            document.getElementById(elementId).innerHTML = newsHtml;
          } else {
            document.getElementById(elementId).innerHTML = "<li>뉴스를 불러오지 못했습니다.</li>";
          }
        })
        .catch(err => {
          document.getElementById(elementId).innerHTML = "<li>뉴스 로딩 중 오류가 발생했습니다.</li>";
        });
    }

    fetchNews('지지율 한국갤럽', 'news-list-gallup');
    fetchNews('지지율 리얼미터', 'news-list-realmeter');

    // 3. 지지율 그래프 그리기 (구글 스프레드시트 연동)
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrpXqyXnwBL7AJ7K51EtGS64VAVHzPGswF-dCXE9LVMFSZZS040xdhkrqkyrccJs1LbGYRvetNIgm/pub?output=csv';
    
    fetch(sheetUrl)
      .then(res => res.text())
      .then(csv => {
        const rows = csv.split('\n').filter(row => row.trim() !== '');
        const labels = [];
        const posData = [];
        const negData = [];

        rows.forEach((row, index) => {
          if (index === 0) return; 
          const cols = row.split(',');
          if (cols.length >= 3) {
            labels.push(cols[0].trim()); 
            posData.push(parseFloat(cols[1].trim())); 
            negData.push(parseFloat(cols[2].trim())); 
          }
        });

        const ctx = document.getElementById('poll-chart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: '긍정 평가 (%)',
                data: posData,
                borderColor: '#d32f2f',
                backgroundColor: 'rgba(211, 47, 47, 0.1)',
                borderWidth: 2,
                pointBackgroundColor: '#d32f2f',
                tension: 0.3,
                fill: true
              },
              {
                label: '부정 평가 (%)',
                data: negData,
                borderColor: '#1976d2',
                backgroundColor: 'rgba(25, 118, 210, 0.1)',
                borderWidth: 2,
                pointBackgroundColor: '#1976d2',
                tension: 0.3,
                fill: true
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { min: 0, max: 100 }
            },
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });
      })
      .catch(err => console.log("그래프 데이터를 불러오는 데 실패했습니다."));
  </script>
</body>
</html>

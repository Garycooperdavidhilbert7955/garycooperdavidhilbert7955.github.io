<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지표 대시보드</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; color: #2c3e50; font-size: 18px; margin-bottom: 15px;}
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
    
    /* 추가된 표(테이블) 디자인 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
    th { background-color: #f8f9fa; font-weight: bold; }
    .poll-source { text-align: right; font-size: 12px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>📊 실시간 대시보드</h1>

  <div class="grid-container">
    <!-- 코스피 위젯 -->
    <div class="card">
      <h3>코스피 (KOSPI)</h3>
      <div id="kospi-number" style="margin-top: 5px; margin-bottom: 15px; font-family: sans-serif;">수치 로딩중...</div>
      <img id="kospi-chart" src="https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png" alt="실시간 코스피 차트" style="width: 100%; border-radius: 4px;">
      <div style="text-align: right; font-size: 12px; color: #888; margin-top: 10px;">* 네이버 증권 실시간 연동</div>
    </div>

    <!-- 환율 위젯 -->
    <div class="card">
      <h3>환율 (USD/KRW)</h3>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
        {
        "symbol": "FX_IDC:USDKRW",
        "width": "100%",
        "height": "220",
        "locale": "kr",
        "dateRange": "1M",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": false,
        "largeChartUrl": ""
        }
        </script>
      </div>
    </div>

    <!-- 지지율 영역 -->
    <div class="card full-width">
      <h3>📈 국정 및 정당 지지율 최신 뉴스</h3>
      <div style="margin-top: 15px; font-size: 14px; color: #555;">
        <ul id="news-list" style="list-style-type: disc; padding-left: 20px; line-height: 1.8;">
          <li>뉴스 불러오는 중...</li>
        </ul>
      </div>
      <div class="poll-source">* 구글 뉴스 실시간 연동 (한국갤럽 지지율)</div>
    </div>
  </div>

  <script>
    // 네이버 실시간 코스피 수치 및 차트 가져오기 (10초 자동 갱신)
    function updateKospi() {
      const targetUrl = 'https://m.stock.naver.com/api/index/KOSPI/basic';
      fetch('https://api.codetabs.com/v1/proxy?quest=' + targetUrl)
        .then(res => res.json())
        .then(data => {
          const price = data.closePrice; 
          const change = data.compareToPreviousClosePrice.replace('+', '');
          const changePct = data.fluctuationsRatio.replace('+', '');
          
          let color = '#333';
          let sign = '';
          if (parseFloat(changePct) > 0) { color = '#d32f2f'; sign = '+'; }
          else if (parseFloat(changePct) < 0) { color = '#1976d2'; }
          
          document.getElementById('kospi-number').innerHTML = 
            `<span style="font-size: 28px; font-weight: bold; color: ${color};">${price}</span> 
             <span style="font-size: 15px; color: ${color}; margin-left: 8px;">${sign}${change} (${sign}${changePct}%)</span>`;
             
          document.getElementById('kospi-chart').src = 'https://ssl.pstatic.net/imgfinance/chart/main/KOSPI.png?' + Date.now();
        })
        .catch(err => console.log("코스피 데이터 갱신 지연"));
    }

    updateKospi();
    setInterval(updateKospi, 10000);

    // 구글 뉴스 실시간 가져오기 (지지율 관련)
    function fetchNews() {
      // 구글 뉴스에서 '대통령 지지율 한국갤럽'을 검색한 결과를 가져옵니다.
      const rssUrl = 'https://news.google.com/rss/search?q=대통령+지지율+한국갤럽&hl=ko&gl=KR&ceid=KR:ko';
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            const items = data.items.slice(0, 5); // 최신 뉴스 5개만 자르기
            let newsHtml = '';
            items.forEach(item => {
              // 뉴스 제목과 링크를 리스트 형태로 만듭니다.
              newsHtml += `<li><a href="${item.link}" target="_blank" style="color: #2c3e50; text-decoration: none;">${item.title}</a></li>`;
            });
            document.getElementById('news-list').innerHTML = newsHtml;
          } else {
            document.getElementById('news-list').innerHTML = "<li>뉴스를 불러오지 못했습니다.</li>";
          }
        })
        .catch(err => {
          document.getElementById('news-list').innerHTML = "<li>뉴스 로딩 중 오류가 발생했습니다.</li>";
        });
    }

    fetchNews(); // 사이트 열릴 때 1번 실행
  </script>
</body>
</html>
